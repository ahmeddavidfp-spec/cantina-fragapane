<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin – La Cantina Fragapane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">
<div class="admin-login-page">
  <div class="admin-login-box">
    <div class="admin-login-logo">
      <div class="admin-login-logo-it">La Cantina</div>
      <div class="admin-login-logo-name">Fragapane</div>
      <div class="admin-login-logo-badge">Espace Administration</div>
    </div>
    {% if error %}
    <div class="admin-login-error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="admin-form-group">
        <label for="password">Mot de passe</label>
        <input class="admin-input" type="password" id="password" name="password"
               placeholder="••••••••" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:.5rem;">
        Se connecter
      </button>
    </form>
    <div style="text-align:center; margin-top:1.5rem;">
      <a href="{{ url_for('index') }}" style="font-size:.8rem; color:var(--text-lt);">← Retour au site</a>
    </div>
  </div>
</div>
</body>
</html>
