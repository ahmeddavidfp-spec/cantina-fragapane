name: Keep-alive (empêche la mise en veille Render)

# Ping léger du service Render pour éviter le "cold start" (~30-60 s) du plan gratuit.
# ⚠️ GitHub Actions n'est qu'un FILET DE SÉCURITÉ : son planificateur est "best-effort"
# et saute/retarde souvent les exécutions. Le keep-alive FIABLE doit venir d'un pinger
# externe (cron-job.org / UptimeRobot) qui appelle /healthz toutes les 5 min.
#
# Fenêtre 06:00–22:59 UTC ≈ 08h00–00h00 heure belge (CEST/CET). La nuit, le service dort
# (économie des heures gratuites Render).

on:
  schedule:
    - cron: '*/5 6-22 * * *'
  workflow_dispatch:        # déclenchement manuel possible

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Réveiller le service (endpoint léger /healthz)
        run: |
          URL="https://cantina-fragapane.onrender.com/healthz"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
          echo "Ping $URL -> HTTP $code"
          if [ "$code" = "000" ]; then
            echo "::warning::Aucune réponse du service (timeout)."
          fi
