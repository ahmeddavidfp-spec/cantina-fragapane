services:
  - type: web
    name: cantina-fragapane
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --graceful-timeout 30
    healthCheckPath: /
    envVars:
      # Chaîne de connexion Postgres (Neon recommandé). À coller dans le dashboard Render.
      - key: DATABASE_URL
        sync: false
      # Généré automatiquement par Render (sessions Flask).
      - key: SECRET_KEY
        generateValue: true
      # Mot de passe du back-office /admin. À définir dans le dashboard Render.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://www.cantinafragapane.be
      - key: PYTHON_VERSION
        value: 3.12.3
      # E-mails ET SMS via l'API HTTPS de Brevo (le SMTP direct ne passe pas depuis
      # Render). La même clé sert aux deux ; les SMS sont payants en crédits Brevo.
      # Obligatoire : sans elle, ni e-mail ni SMS ne partent.
      - key: BREVO_API_KEY
        sync: false
      # Facultatif : nom d'expéditeur des SMS (11 caractères max). Sans lui, aucun SMS n'est envoyé.
      - key: SMS_SENDER
        sync: false
      # Facultatif : adresse qui reçoit les notifications (réservations, contact).
      # Repli sur info@cantinafragapane.be si absente.
      - key: MAIL_TO
        sync: false
